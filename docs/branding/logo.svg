<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70" fill="none">
  <!-- Crest Emblem Shield -->
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D3E" />
      <stop offset="100%" stop-color="#1D5D5E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8C2C" />
    </linearGradient>
  </defs>
  
  <g transform="translate(10, 5)">
    <!-- Outer Shield -->
    <path d="M30 0 L55 10 C55 35 45 52 30 60 C15 52 5 35 5 10 Z" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Inner Academic Torch / Book / Star Motif -->
    <!-- Open Book Base -->
    <path d="M18 42 C24 38 30 40 30 40 C30 40 36 38 42 42 C42 42 36 34 30 35 C24 34 18 42 18 42 Z" fill="url(#goldGrad)" />
    <!-- Torch Flame -->
    <path d="M30 14 C32 20 37 24 30 33 C23 24 28 20 30 14 Z" fill="url(#goldGrad)" />
    <!-- Academic Star on Top -->
    <polygon points="30,4 32,9 37,9 33,12 35,17 30,14 25,17 27,12 23,9 28,9" fill="#FFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(75, 18)">
    <text x="0" y="14" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0F3D3E" letter-spacing="0.5">GREEN VALLEY</text>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#D4AF37" letter-spacing="2.8">INTERNATIONAL SCHOOL</text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8.5" fill="#6B7280" letter-spacing="1">CBSE AFFILIATED • ESTD 2010</text>
  </g>
</svg>
